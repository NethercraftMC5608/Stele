[package]
name = "nk-core"
version = "0.1.0"
edition = "2021"
# The core is GPL-2.0-or-later, as Stele is. linux/ (the shim) is GPL-2.0-only,
# as Linux is; see nk/README.md.
license = "GPL-2.0-or-later"
# Edition 2021 deliberately: 2024 requires #[unsafe(no_mangle)] on every symbol
# the assembler calls, which is noise in a file that is nothing but such symbols.

[[bin]]
name = "nk"
path = "src/main.rs"

# Stele's arm64 -> x86-64 translator, linked into nk (ROADMAP Phase 4). Off by
# default: `--features stela` builds nk with it and runs trusted translated
# ARM64 execution checks at x86 boot, before SMP and LKL startup.
[features]
stela = ["dep:stela-compiler", "dep:stela-engine", "dep:stela-contracts", "dep:stela-crypto", "dep:stela-soc", "dep:stela-soc-data"]

[dependencies]
stela-compiler = { path = "../../crates/stela-compiler", default-features = false, optional = true }
stela-engine = { path = "../../crates/stela-engine", default-features = false, optional = true }
stela-contracts = { path = "../../crates/stela-contracts", default-features = false, optional = true }
stela-crypto = { path = "../../crates/stela-crypto", features = ["force-software"], optional = true }
stela-soc = { path = "../../crates/stela-soc", default-features = false, optional = true }
stela-soc-data = { path = "../../crates/stela-soc-data", default-features = false, optional = true }
